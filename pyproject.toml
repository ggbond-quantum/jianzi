[project]
name = "jianzipu"
version = "0.1.0"
description = "古琴减字谱字体：数据库驱动的字体编译与预览"
requires-python = ">=3.12"
dependencies = [
    "fonttools>=4.50",
    "svgpathtools>=1.6",
]

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pytest>=8.0",
    "uharfbuzz>=0.56.2",
]

[project.scripts]
jianzi-extract = "jianzipu.extract.cli:main"
jianzi-compile = "jianzipu.compile.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jianzipu"]
